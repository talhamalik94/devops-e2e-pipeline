apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo-app
  labels:
    app: demo-app
spec:
  type: ClusterIP          # internal only; reach it with `kubectl port-forward` or an Ingress
  ports:
    - port: 80
      targetPort: http     # named port on the container (8080)
      protocol: TCP
      name: http
  selector:
    app: demo-app          # routes to every ready pod with this label
