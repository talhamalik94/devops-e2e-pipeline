apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo-app
  labels:
    app: demo-app
spec:
  replicas: 2
  revisionHistoryLimit: 5            # keep 5 old ReplicaSets for `kubectl rollout undo`
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0              # never drop below 2 ready pods during a rollout
      maxSurge: 1                    # add one new pod at a time
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      automountServiceAccountToken: false   # app never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # CI and `kubectl set image` replace this with an immutable commit-SHA tag.
          image: docker.io/beingmalik/demo-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ENV
              value: "production"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:               # failing -> kubelet restarts the container
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:              # failing -> pod removed from Service endpoints
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp          # gunicorn needs a writable /tmp; root FS is read-only
      volumes:
        - name: tmp
          emptyDir: {}
---
# Voluntary disruptions (node drain, cluster upgrade) must leave at least 1 pod running.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-app
  namespace: demo-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: demo-app
