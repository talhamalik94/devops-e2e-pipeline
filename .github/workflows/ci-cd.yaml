name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:           # allow a manual run from the Actions tab

# Least privilege: the automatic GITHUB_TOKEN can only read the repo.
permissions:
  contents: read

# A newer commit on the same branch/PR cancels the older, still-running pipeline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: beingmalik/demo-app

# Every third-party action is pinned to a full commit SHA (tags can be
# force-pushed to malicious code; SHAs cannot). Dependabot updates the pins.
jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt
      - name: Run tests
        working-directory: app
        run: python -m pytest -v

  build:
    name: Build, scan, deploy-test & push
    needs: test                # no image is built unless the tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image tag (short commit SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 1) Build ONCE and load into the runner's Docker. Nothing is pushed yet.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          load: true
          push: false
          build-args: APP_VERSION=${{ env.SHORT_SHA }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Security gate: report HIGH + CRITICAL, block the pipeline on CRITICAL
      #    vulnerabilities that already have a fix available.
      - name: Vulnerability report (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"
      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # 3) Deploy-test: spin up a throwaway Kubernetes cluster inside the runner,
      #    deploy the real manifests with this exact image, and smoke-test it.
      - name: Create throwaway Kubernetes cluster (kind)
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ci
      - name: Deploy manifests and smoke-test
        run: |
          set -euo pipefail
          IMAGE="$IMAGE_NAME:$SHORT_SHA"

          # Copy the locally built image into the kind node (no registry needed)
          kind load docker-image "$IMAGE" --name ci

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service.yaml
          # Render the Deployment with the exact commit tag, then apply it
          sed -E "s#^( *image: ).*#\1${IMAGE}#" k8s/deployment.yaml | kubectl apply -f -

          if ! kubectl rollout status deployment/demo-app -n demo-app --timeout=120s; then
            kubectl get pods -n demo-app -o wide
            kubectl describe pods -n demo-app
            exit 1
          fi

          kubectl port-forward -n demo-app svc/demo-app 8080:80 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 2; done
          echo
          curl -fsS localhost:8080/ | tee index.json
          echo
          # Prove the pods are running THIS commit, not some older image
          jq -e --arg v "$SHORT_SHA" '.version == $v' index.json

      # 4) Publish the exact image that passed tests, scan and deploy-test.
      #    Only on pushes to main; pull requests never receive registry secrets.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_NAME:$SHORT_SHA"
          docker tag "$IMAGE_NAME:$SHORT_SHA" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"
